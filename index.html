
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fishing Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101b20;
      color: #f4f7f5;
    }

    header {
      padding: 24px 7%;
      border-bottom: 1px solid #293a3d;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #8bc9a4;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 35px;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 15px;
    }

    .hero p {
      color: #aabbb5;
      line-height: 1.6;
    }

    .container {
      max-width: 650px;
      margin: 20px auto 70px;
      padding: 30px;
      background: #1b292d;
      border: 1px solid #344649;
      border-radius: 16px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #40575a;
      background: #101b20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #65aa80;
      color: #102019;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #82c398;
    }

    #message {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #263b35;
      border: 1px solid #65aa80;
      border-radius: 10px;
      line-height: 1.8;
      white-space: pre-line;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #82948d;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎣 Fishing Assistant</div>
  </header>

  <section class="hero">
    <h1>Fish Smarter.</h1>
    <p>
      Tell us about your fishing conditions.
      We'll help you figure out what to throw.
    </p>
  </section>

  <main class="container">

    <h2>Fishing Conditions</h2>
    <p>Tell us where and what you're fishing for.</p>

    <form id="fishingForm">

      <label for="species">Target species</label>
      <select id="species" required>
        <option value="">Select a species</option>
        <option value="Largemouth Bass">Largemouth Bass</option>
        <option value="Smallmouth Bass">Smallmouth Bass</option>
        <option value="Trout">Trout</option>
        <option value="Catfish">Catfish</option>
        <option value="Crappie">Crappie</option>
        <option value="Other">Other</option>
      </select>

     
      <label for="water">Type of water</label>
      <select id="water" required>
        <option value="">Select water type</option>
        <option value="Lake">Lake</option>
        <option value="Pond">Pond</option>
        <option value="Reservoir">Reservoir</option>
      </select>

      <label for="temperature">Water temperature (°F)</label>
      <input type="number" id="temperature"
        min="32" max="100" placeholder="Example: 68">

      <label for="clarity">Water clarity</label>
      <select id="clarity" required>
        <option value="">Select clarity</option>
        <option value="Clear">Clear</option>
        <option value="Slightly stained">Slightly stained</option>
        <option value="Stained">Stained</option>
        <option value="Muddy">Muddy</option>
      </select>

      <label for="weather">Weather</label>
      <select id="weather" required>
        <option value="">Select weather</option>
        <option value="Sunny">Sunny</option>
        <option value="Partly cloudy">Partly cloudy</option>
        <option value="Cloudy">Cloudy</option>
        <option value="Rainy">Rainy</option>
      </select>

      <!-- SEASON -->
      <label for="season">Season</label>
      <select id="season">
        <option value="">Select season</option>
        <option value="Spring">Spring</option>
        <option value="Summer">Summer</option>
        <option value="Fall">Fall</option>
        <option value="Winter">Winter</option>
      </select>

      <!-- TIME OF DAY -->
      <label for="time">Time of day</label>
      <select id="time">
        <option value="">Select time</option>
        <option value="Early morning">Early morning</option>
        <option value="Morning">Morning</option>
        <option value="Midday">Midday</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
        <option value="Night">Night</option>
      </select>

      <!-- WIND SPEED -->
      <label for="wind">Wind speed (mph)</label>
      <input
        type="number"
        id="wind"
        min="0" 
        max="100"
        placeholder="Example: 8"
>
      
      <!-- WIND DIRECTION -->
      <label for="windDirection">Wind direction</label>
      <select id="windDirection">
        <option value="">Select direction</option>
        <option value="North">North</option>
        <option value="Northeast">Northeast</option>
        <option value="East">East</option>
        <option value="Southeast">Southeast</option>
        <option value="South">South</option>
        <option value="Southwest">Southwest</option>
        <option value="West">West</option>
        <option value="Northwest">Northwest</option>
        <option value="Variable">Variable</option>
      </select>
      
      <!-- STRUCTURE AND COVER -->
      <label for="structure">What type of cover are you fishing?</label>
      <select id="structure">
        <option value="">Not sure / Unknown</option>
        <option value="Grass">Grass or vegetation</option>
        <option value="Wood">Trees, logs, or brush</option>
        <option value="Rocks">Rocks or boulders</option>
        <option value="Docks">Docks or boat structures</option>
        <option value="Open water">Open water</option>
        <option value="Mixed">Multiple types</option>
      </select>
      
      <!-- WATER DEPTH -->
      <label for="depth">Water depth</label>
      <select id="depth">
        <option value="">Not sure</option>
        <option value="Shallow">Shallow (0–5 feet)</option>
        <option value="Medium">Medium (5–15 feet)</option>
        <option value="Deep">Deep (15+ feet)</option>
      </select>
      
      <!-- BAITFISH -->
      <label for="forage">What do you think the bass are feeding on?</label>
      <select id="forage">
        <option value="">Not sure</option>
        <option value="Shad">Shad</option>
        <option value="Bluegill">Bluegill</option>
        <option value="Crawfish">Crawfish</option>
        <option value="Other">Other small prey</option>
      </select>
      
      <button type="submit">Get Fishing Recommendations</button>

 

    </form>

    <div id="message"></div>

  </main>

  <footer>
    Fishing Assistant | Built for anglers
  </footer>

  <script>

   

const form = document.getElementById("fishingForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  // ==========================================
  // 1. COLLECT FISHING CONDITIONS
  // ==========================================

  const get = id => document.getElementById(id)?.value || "";

  const species = get("species");
  const water = get("water");
  const tempText = get("temperature");
  const clarity = get("clarity").toLowerCase();
  const weather = get("weather").toLowerCase();
  const season = get("season").toLowerCase();
  const time = get("time").toLowerCase();
  const windText = get("wind");
  const windDirection = get("windDirection");
  const structure = get("structure").toLowerCase();
  const depth = get("depth").toLowerCase();
  const forage = get("forage").toLowerCase();

  const temp = tempText === "" ? null : Number(tempText);
  const wind = windText === "" ? null : Number(windText);

  const result = document.getElementById("message");

  if (!species.toLowerCase().includes("bass")) {
    result.textContent =
      "This version currently supports bass fishing. Choose largemouth bass to continue.";
    result.style.display = "block";
    return;
  }

  if (temp !== null && (!Number.isFinite(temp) || temp < 32 || temp > 100)) {
    result.textContent = "Please enter a water temperature between 32 and 100°F.";
    result.style.display = "block";
    return;
  }

  if (wind !== null && (!Number.isFinite(wind) || wind < 0 || wind > 100)) {
    result.textContent = "Please enter a valid wind speed.";
    result.style.display = "block";
    return;
  }

  // ==========================================
  // 2. CREATE THE LURE DATABASE
  // ==========================================

 
// ================================================
// NEW RECOMMENDATION ENGINE
// Uses the 22 techniques in LureDatabase.js
// ================================================

// Only support largemouth bass in this version.
if (species !== "Largemouth Bass") {
  result.style.display = "block";
  result.textContent =
    "This version currently supports largemouth bass only. Support for other species will be added later.";
  result.scrollIntoView({ behavior: "smooth", block: "start" });
  return;
}

// Make sure the database loaded correctly.
if (!Array.isArray(window.lureDatabase)) {
  result.style.display = "block";
  result.textContent =
    "The lure database could not be loaded. Please refresh the page and try again.";
  return;
}

// Start every technique with a neutral score.
const lures = window.lureDatabase.map(item => ({
  id: item.id,
  name: item.name,
  score: 0,
  reasons: [],
  color: item.colorGuidance,
  size: "Choose a size and weight appropriate for the local forage, depth, and tackle.",
  depth: item.depthGuidance,
  technique: item.presentation,
  confidence: item.confidence
}));

// Add points and explanations to a technique.
function addPoints(id, points, reason) {
  const lure = lures.find(item => item.id === id);
  if (!lure) return;

  lure.score += points;

  if (reason && !lure.reasons.includes(reason)) {
    lure.reasons.push(reason);
  }
}

// Add the same condition to several techniques.
function addMany(ids, points, reason) {
  ids.forEach(id => addPoints(id, points, reason));
}

// -----------------------------------------------
// 1. WATER CLARITY
// -----------------------------------------------

if (clarity.includes("clear")) {
  addMany(
    ["jerkbait", "wacky_rig", "drop_shot", "ned_rig", "neko_rig", "shaky_head"],
    2,
    "Clear water makes a more natural or subtle presentation worth considering."
  );
}

if (clarity.includes("slightly stained")) {
  addMany(
    ["spinnerbait", "squarebill", "swimbait", "texas_rig", "wacky_rig"],
    1,
    "These presentations offer different ways to search or target cover in slightly stained water."
  );
}

if (clarity.includes("stained")) {
  addMany(
    ["spinnerbait", "chatterbait", "squarebill", "lipless_crankbait"],
    2,
    "Flash, vibration, or movement may help bass locate these moving baits."
  );

  addMany(
    ["texas_rig", "flipping_jig", "casting_jig"],
    1,
    "These can target bass holding near cover in stained water."
  );
}

if (clarity.includes("muddy")) {
  addMany(
    ["spinnerbait", "chatterbait", "lipless_crankbait"],
    2,
    "Vibration and movement may help bass detect a moving bait in muddy water."
  );

  addMany(
    ["flipping_jig", "texas_rig"],
    1,
    "A controlled presentation near identifiable cover is another option."
  );
}

// -----------------------------------------------
// 2. STRUCTURE AND COVER
// -----------------------------------------------

if (structure === "Grass") {
  addMany(
    ["chatterbait", "swim_jig", "lipless_crankbait", "spinnerbait"],
    3,
    "This lure can be worked around vegetation or its edges."
  );

  addMany(
    ["texas_rig", "weightless_texas", "flipping_jig"],
    2,
    "A weedless or cover-oriented presentation can help fish vegetation."
  );
}

if (structure === "Wood") {
  addMany(
    ["texas_rig", "flipping_jig", "casting_jig", "squarebill"],
    3,
    "This presentation is suitable for targeting bass around wood cover."
  );

  addMany(
    ["weightless_texas", "wacky_rig"],
    1,
    "A slower presentation may be useful around individual wood targets."
  );
}

if (structure === "Rocks") {
  addMany(
    ["football_jig", "squarebill", "shallow_crankbait", "deep_crankbait"],
    3,
    "This lure can be used to search or contact rocky structure."
  );

  addMany(
    ["ned_rig", "shaky_head", "carolina_rig"],
    2,
    "A bottom-oriented presentation is worth considering around rock."
  );
}

if (structure === "Docks") {
  addMany(
    ["wacky_rig", "texas_rig", "flipping_jig", "neko_rig"],
    3,
    "This presentation can target specific areas around docks."
  );

  addMany(
    ["shaky_head", "finesse_jig"],
    2,
    "A slower presentation is another option for fishing dock targets."
  );
}

if (structure === "Open water") {
  addMany(
    ["jerkbait", "soft_swimbait", "lipless_crankbait", "drop_shot"],
    2,
    "This presentation can be used away from dense shoreline cover."
  );
}

if (structure === "Mixed") {
  addMany(
    ["spinnerbait", "texas_rig", "casting_jig", "soft_swimbait"],
    1,
    "This is a flexible option when several types of cover are present."
  );
}

// -----------------------------------------------
// 3. WATER DEPTH
// -----------------------------------------------

if (depth === "Shallow") {
  addMany(
    [
      "topwater_walking",
      "squarebill",
      "shallow_crankbait",
      "weightless_texas",
      "wacky_rig",
      "swim_jig",
      "chatterbait"
    ],
    3,
    "This presentation can target shallow water."
  );

  addPoints(
    "spinnerbait",
    2,
    "A spinnerbait can be retrieved through shallow water."
  );
}

if (depth === "Medium") {
  addMany(
    [
      "jerkbait",
      "lipless_crankbait",
      "soft_swimbait",
      "texas_rig",
      "drop_shot",
      "shaky_head"
    ],
    2,
    "This technique can be adjusted to fish medium depths."
  );
}

if (depth === "Deep") {
  addMany(
    [
      "deep_crankbait",
      "drop_shot",
      "carolina_rig",
      "football_jig",
      "ned_rig"
    ],
    3,
    "This technique can be used to reach or target deeper bass."
  );

  addMany(
    ["shaky_head", "texas_rig"],
    2,
    "These rigs can be adjusted to fish deeper water."
  );
}

// -----------------------------------------------
// 4. FORAGE
// -----------------------------------------------

if (forage === "Shad") {
  addMany(
    [
      "spinnerbait",
      "chatterbait",
      "jerkbait",
      "lipless_crankbait",
      "soft_swimbait",
      "topwater_walking"
    ],
    3,
    "This lure can imitate or resemble a shad or other baitfish."
  );
}

if (forage === "Bluegill") {
  addMany(
    ["swim_jig", "flipping_jig", "casting_jig", "spinnerbait", "soft_swimbait"],
    2,
    "This lure can provide a profile or presentation suitable for targeting bass feeding on bluegill."
  );
}

if (forage === "Crawfish") {
  addMany(
    ["football_jig", "finesse_jig", "squarebill", "texas_rig", "ned_rig"],
    3,
    "This lure or presentation can imitate crawfish or other bottom-oriented prey."
  );
}

// -----------------------------------------------
// 5. WEATHER AND LIGHT
// -----------------------------------------------

if (weather.includes("cloudy") || weather.includes("rainy")) {
  addMany(
    ["spinnerbait", "chatterbait", "squarebill"],
    1,
    "Moving baits are worth considering under these conditions, depending on fish activity."
  );
}

if (weather.includes("sunny")) {
  if (structure === "Docks" || structure === "Wood") {
    addMany(
      ["texas_rig", "wacky_rig", "flipping_jig"],
      2,
      "A slower presentation can target shaded areas around cover."
    );
  }
}

// -----------------------------------------------
// 6. TIME OF DAY
// -----------------------------------------------

if (time.includes("early morning") || time === "morning" || time === "evening") {
  addMany(
    ["topwater_walking", "spinnerbait"],
    1,
    "Surface or moving presentations may be worth testing during lower-light periods."
  );
}

if (time === "midday" || time === "afternoon") {
  if (structure === "Docks" || structure === "Wood" || structure === "Grass") {
    addMany(
      ["texas_rig", "wacky_rig", "flipping_jig"],
      2,
      "These presentations can target specific cover during the middle of the day."
    );
  }
}

if (time === "night") {
  addMany(
    ["texas_rig", "spinnerbait", "flipping_jig"],
    1,
    "These presentations are options for targeting bass around cover at night."
  );
}

// -----------------------------------------------
// 7. WIND
// -----------------------------------------------

if (wind !== null && wind >= 10) {
  addMany(
    ["spinnerbait", "chatterbait", "lipless_crankbait"],
    2,
    "Wind can create opportunities for moving baits, especially around wind-affected areas."
  );
} else if (wind !== null && wind >= 5) {
  addMany(
    ["spinnerbait", "chatterbait"],
    1,
    "Some wind may make a moving presentation worth testing."
  );
}

// Wind direction is intentionally not scored.
// Direction alone does not tell us which bank is windblown.

// -----------------------------------------------
// 8. WATER TEMPERATURE
// -----------------------------------------------

// These are broad, cautious tendencies, not fixed
// temperature rules. Bass behavior varies by location,
// season, weather history, and other conditions.

if (temp !== null && temp <= 55) {
  addMany(
    ["jerkbait", "lipless_crankbait", "football_jig", "ned_rig"],
    1,
    "These presentations are worth considering in cooler water, but fish activity and location still matter."
  );
}

if (temp !== null && temp >= 75) {
  addMany(
    ["drop_shot", "texas_rig", "football_jig", "deep_crankbait"],
    1,
    "These techniques can help target bass near deeper structure or cover when fish are holding there."
  );
}

// -----------------------------------------------
// 9. REMOVE UNSUPPORTED TECHNIQUES AND RANK
// -----------------------------------------------

// Give every technique a small neutral starting score.
// This prevents a technique from disappearing simply
// because the angler did not know an answer.

lures.forEach(lure => {
  lure.score += 1;

  if (lure.reasons.length === 0) {
    lure.reasons.push(
      "This is a general option. The conditions entered did not strongly favor it."
    );
  }
});

// Rank the techniques by their experimental match points.
lures.sort((a, b) => b.score - a.score);

// Show the three highest-ranked techniques.
const topThree = lures.slice(0, 3);

  // ==========================================
  // 14. DISPLAY RESULTS
  // ==========================================

  const conditionSummary = [
    temp !== null ? temp + "°F water" : "Unknown temperature",
    season || "Unknown season",
    time || "Unknown time",
    clarity || "Unknown clarity",
    wind !== null ? wind + " mph wind" : "Unknown wind",
    structure || "Unknown structure",
    depth || "Unknown depth",
    forage || "Unknown forage"
  ].join(" • ");

  result.style.display = "block";

  result.innerHTML = `
    <div style="margin-top:25px; padding:20px; border-radius:12px; background:#172a2c; color:#f4f7f5;">

      <h2 style="margin-top:0;">Your Top 3 Bass Recommendations</h2>

      <p style="color:#b9c9c4; font-size:13px;">
        Based on the conditions you entered.
      </p>

      <p style="font-size:13px; color:#b9c9c4;">
        ${conditionSummary}
      </p>

      ${topThree.map((lure, index) => `
        <div style="padding:16px; margin-top:15px; background:#203739; border-radius:10px;">

          <div style="font-size:13px; color:#9fd7b5;">
            RANK #${index + 1}
          </div>

          <h3 style="margin:8px 0;">
            ${lure.name}
          </h3>

          <div style="font-size:25px; font-weight:bold;">
            ${lure.score}/100
          </div>

          <div style="height:8px; background:#344c4d; border-radius:10px; margin:10px 0;">
            <div style="height:8px; width:${lure.score}%; background:#67b68c; border-radius:10px;"></div>
          </div>

          <p><strong>Color:</strong> ${lure.color}</p>
          <p><strong>Size:</strong> ${lure.size}</p>
          <p><strong>Suggested depth:</strong> ${lure.depth}</p>
          <p><strong>Technique:</strong> ${lure.technique}</p>

          <strong>Why it ranked here:</strong>

          <ul>
            ${lure.reasons.length
              ? lure.reasons.slice(0, 4).map(reason => `<li>${reason}</li>`).join("")
              : "<li>It remains a general option, but the available conditions did not strongly favor it.</li>"
            }
          </ul>

        </div>
      `).join("")}

      <p style="font-size:12px; color:#b9c9c4; margin-top:18px;">
        Scores represent preliminary condition matches, not catch probabilities.
        Missing information is not treated as a known condition.
        These rankings are starting suggestions, not guaranteed results.
      </p>

    </div>
  `;

  result.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
<script src="LureDatabase.js"></script>
  <script>
  document.body.insertAdjacentHTML(
    "beforeend",
    "<p style='padding:10px;background:#d1fae5;color:#065f46;'>Database loaded: " +
    (window.lureDatabase ? window.lureDatabase.length : 0) +
    " techniques</p>"
  );
</script>
</body>
</html>
