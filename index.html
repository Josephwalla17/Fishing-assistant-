
<script>
  const form = document.getElementById("fishingForm");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const species = document.getElementById("species").value;
    const water = document.getElementById("water").value;
    const temperature = Number(
      document.getElementById("temperature").value
    );
    const clarity = document.getElementById("clarity").value;
    const weather = document.getElementById("weather").value;

    let lure = "";
    let color = "";
    let technique = "";
    let depth = "";
    let reason = "";

    // BASS RECOMMENDATIONS
    if (species.includes("Bass")) {

      if (temperature && temperature < 55) {
        lure = "Suspending jerkbait";
        color = clarity === "Clear"
          ? "Natural shad"
          : "Chartreuse or white";
        technique = "Fish slowly with pauses between movements.";
        depth = "Try the middle of the water column.";
        reason = "Cool water often makes bass less willing to chase fast-moving prey.";
      }

      else if (clarity === "Muddy" || clarity === "Stained") {
        lure = "Spinnerbait";
        color = "White and chartreuse";
        technique = "Retrieve steadily, allowing the blades to create vibration.";
        depth = "Start around shallow cover and nearby structure.";
        reason = "Vibration and visible colors can help fish locate the bait in reduced visibility.";
      }

      else if (weather === "Cloudy" || weather === "Rainy") {
        lure = "Spinnerbait";
        color = "White or white and chartreuse";
        technique = "Use a steady retrieve around cover.";
        depth = "Start in shallow to medium-depth water.";
        reason = "Lower light can encourage bass to move around and feed.";
      }

      else {
        lure = "Texas-rigged soft plastic worm";
        color = clarity === "Clear"
          ? "Green pumpkin"
          : "Black and blue";
        technique = "Fish slowly around vegetation, rocks, and other cover.";
        depth = "Start near the bottom.";
        reason = "A natural-looking soft plastic is a versatile option around bass cover.";
      }
    }

    // TROUT RECOMMENDATIONS
    else if (species === "Trout") {
      lure = "Small inline spinner";
      color = clarity === "Clear" ? "Silver" : "Gold";
      technique = "Use a steady retrieve, adjusting speed to the current.";
      depth = "Try the upper and middle portions of the water column.";
      reason = "Small spinners imitate moving prey and create flash.";
    }

    // CATFISH RECOMMENDATIONS
    else if (species === "Catfish") {
      lure = "Natural bait on a bottom rig";
      color = "Not applicable";
      technique = "Present bait near the bottom and allow time for fish to find it.";
      depth = "Near the bottom.";
      reason = "Catfish commonly use their sense of smell and taste to locate food.";
    }

    // CRAPPIE RECOMMENDATIONS
    else if (species === "Crappie") {
      lure = "Small crappie jig";
      color = clarity === "Clear" ? "White or silver" : "Chartreuse";
      technique = "Use a slow retrieve or gently jig around cover.";
      depth = "Try around submerged cover and different depths.";
      reason = "Small jigs imitate the baitfish and small prey crappie eat.";
    }

    // OTHER SPECIES
    else {
      lure = "Small natural bait or a species-specific lure";
      color = "Match local forage and water clarity";
      technique = "Start with a presentation appropriate for your target species.";
      depth = "Explore different depths.";
      reason = "We need more species-specific information to make a reliable recommendation.";
    }

    const result = document.getElementById("message");

    result.textContent =
      "YOUR FISHING RECOMMENDATION\n\n" +
      "Target: " + species + "\n\n" +
      "Recommended lure or bait: " + lure + "\n" +
      "Color: " + color + "\n" +
      "Technique: " + technique + "\n" +
      "Suggested depth: " + depth + "\n\n" +
      "WHY WE RECOMMEND IT\n" + reason +
      "\n\nThis is a starting suggestion. Actual fish behavior depends on many conditions.";
  });
</script>
