
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fishing Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101b20;
      color: #f4f7f5;
    }

    header {
      padding: 24px 7%;
      border-bottom: 1px solid #293a3d;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #8bc9a4;
    }

    .hero {
      text-align: center;
      padding: 60px 20px 35px;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 52px);
      margin-bottom: 15px;
    }

    .hero p {
      color: #aabbb5;
      line-height: 1.6;
    }

    .container {
      max-width: 650px;
      margin: 20px auto 70px;
      padding: 30px;
      background: #1b292d;
      border: 1px solid #344649;
      border-radius: 16px;
    }

    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
    }

    select, input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #40575a;
      background: #101b20;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      background: #65aa80;
      color: #102019;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #82c398;
    }

    #message {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background: #263b35;
      border: 1px solid #65aa80;
      border-radius: 10px;
      line-height: 1.8;
      white-space: pre-line;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #82948d;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">🎣 Fishing Assistant</div>
  </header>

  <section class="hero">
    <h1>Fish Smarter.</h1>
    <p>
      Tell us about your fishing conditions.
      We'll help you figure out what to throw.
    </p>
  </section>

  <main class="container">

    <h2>Fishing Conditions</h2>
    <p>Tell us where and what you're fishing for.</p>

    <form id="fishingForm">

      <label for="species">Target species</label>
      <select id="species" required>
        <option value="">Select a species</option>
        <option value="Largemouth Bass">Largemouth Bass</option>
        <option value="Smallmouth Bass">Smallmouth Bass</option>
        <option value="Trout">Trout</option>
        <option value="Catfish">Catfish</option>
        <option value="Crappie">Crappie</option>
        <option value="Other">Other</option>
      </select>

     
      <label for="water">Type of water</label>
      <select id="water" required>
        <option value="">Select water type</option>
        <option value="Lake">Lake</option>
        <option value="Pond">Pond</option>
        <option value="Reservoir">Reservoir</option>
      </select>

      <label for="temperature">Water temperature (°F)</label>
      <input type="number" id="temperature"
        min="32" max="100" placeholder="Example: 68">

      <label for="clarity">Water clarity</label>
      <select id="clarity" required>
        <option value="">Select clarity</option>
        <option value="Clear">Clear</option>
        <option value="Slightly stained">Slightly stained</option>
        <option value="Stained">Stained</option>
        <option value="Muddy">Muddy</option>
      </select>

      <label for="weather">Weather</label>
      <select id="weather" required>
        <option value="">Select weather</option>
        <option value="Sunny">Sunny</option>
        <option value="Partly cloudy">Partly cloudy</option>
        <option value="Cloudy">Cloudy</option>
        <option value="Rainy">Rainy</option>
      </select>

      <!-- SEASON -->
      <label for="season">Season</label>
      <select id="season">
        <option value="">Select season</option>
        <option value="Spring">Spring</option>
        <option value="Summer">Summer</option>
        <option value="Fall">Fall</option>
        <option value="Winter">Winter</option>
      </select>

      <!-- TIME OF DAY -->
      <label for="time">Time of day</label>
      <select id="time">
        <option value="">Select time</option>
        <option value="Early morning">Early morning</option>
        <option value="Morning">Morning</option>
        <option value="Midday">Midday</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
        <option value="Night">Night</option>
      </select>

      <!-- WIND SPEED -->
      <label for="wind">Wind speed (mph)</label>
      <input
        type="number"
        id="wind"
        min="0" 
        max="100"
        placeholder="Example: 8"
>
      
      <!-- WIND DIRECTION -->
      <label for="windDirection">Wind direction</label>
      <select id="windDirection">
        <option value="">Select direction</option>
        <option value="North">North</option>
        <option value="Northeast">Northeast</option>
        <option value="East">East</option>
        <option value="Southeast">Southeast</option>
        <option value="South">South</option>
        <option value="Southwest">Southwest</option>
        <option value="West">West</option>
        <option value="Northwest">Northwest</option>
        <option value="Variable">Variable</option>
      </select>
      
      <!-- STRUCTURE AND COVER -->
      <label for="structure">What type of cover are you fishing?</label>
      <select id="structure">
        <option value="">Not sure / Unknown</option>
        <option value="Grass">Grass or vegetation</option>
        <option value="Wood">Trees, logs, or brush</option>
        <option value="Rocks">Rocks or boulders</option>
        <option value="Docks">Docks or boat structures</option>
        <option value="Open water">Open water</option>
        <option value="Mixed">Multiple types</option>
      </select>
      
      <!-- WATER DEPTH -->
      <label for="depth">Water depth</label>
      <select id="depth">
        <option value="">Not sure</option>
        <option value="Shallow">Shallow (0–5 feet)</option>
        <option value="Medium">Medium (5–15 feet)</option>
        <option value="Deep">Deep (15+ feet)</option>
      </select>
      
      <!-- BAITFISH -->
      <label for="forage">What do you think the bass are feeding on?</label>
      <select id="forage">
        <option value="">Not sure</option>
        <option value="Shad">Shad</option>
        <option value="Bluegill">Bluegill</option>
        <option value="Crawfish">Crawfish</option>
        <option value="Other">Other small prey</option>
      </select>
      
      <button type="submit">Get Fishing Recommendations</button>

 

    </form>

    <div id="message"></div>

  </main>

  <footer>
    Fishing Assistant | Built for anglers
  </footer>

  <script>

   

const form = document.getElementById("fishingForm");

form.addEventListener("submit", function(event) {
  event.preventDefault();

  // ==========================================
  // 1. COLLECT FISHING CONDITIONS
  // ==========================================

  const get = id => document.getElementById(id)?.value || "";

  const species = get("species");
  const water = get("water");
  const tempText = get("temperature");
  const clarity = get("clarity").toLowerCase();
  const weather = get("weather").toLowerCase();
  const season = get("season").toLowerCase();
  const time = get("time").toLowerCase();
  const windText = get("wind");
  const windDirection = get("windDirection");
  const structure = get("structure").toLowerCase();
  const depth = get("depth").toLowerCase();
  const forage = get("forage").toLowerCase();

  const temp = tempText === "" ? null : Number(tempText);
  const wind = windText === "" ? null : Number(windText);

  const result = document.getElementById("message");

  if (!species.toLowerCase().includes("bass")) {
    result.textContent =
      "This version currently supports bass fishing. Choose largemouth bass to continue.";
    result.style.display = "block";
    return;
  }

  if (temp !== null && (!Number.isFinite(temp) || temp < 32 || temp > 100)) {
    result.textContent = "Please enter a water temperature between 32 and 100°F.";
    result.style.display = "block";
    return;
  }

  if (wind !== null && (!Number.isFinite(wind) || wind < 0 || wind > 100)) {
    result.textContent = "Please enter a valid wind speed.";
    result.style.display = "block";
    return;
  }

  // ==========================================
  // 2. CREATE THE LURE DATABASE
  // ==========================================

  const lures = [
    {
      name: "Spinnerbait",
      color: "White, chartreuse, or natural shad",
      size: "3/8 oz starting point",
      depth: "Match the retrieve to the depth of the cover",
      technique: "Cast past the target and retrieve steadily. Try varying speed.",
      score: 50,
      reasons: []
    },
    {
      name: "Chatterbait",
      color: "Green pumpkin, white, or bluegill",
      size: "3/8 oz starting point",
      depth: "Shallow to medium, depending on model",
      technique: "Retrieve steadily through or alongside vegetation.",
      score: 50,
      reasons: []
    },
    {
      name: "Texas-Rigged Worm",
      color: "Green pumpkin, watermelon, or black and blue",
      size: "6-inch worm starting point",
      depth: "Bottom and around cover",
      technique: "Let it sink, then drag slowly and pause.",
      score: 50,
      reasons: []
    },
    {
      name: "Bass Jig",
      color: "Green pumpkin, brown, or black and blue",
      size: "3/8 oz starting point",
      depth: "Bottom and around structure",
      technique: "Work slowly around wood, rocks, and vegetation.",
      score: 50,
      reasons: []
    },
    {
      name: "Squarebill Crankbait",
      color: "Shad, crawfish, or bluegill",
      size: "Medium-sized shallow-running model",
      depth: "Use a model that reaches the target depth",
      technique: "Retrieve around shallow rocks and wood.",
      score: 50,
      reasons: []
    },
    {
      name: "Lipless Crankbait",
      color: "Shad, crawfish, or bluegill",
      size: "1/2 oz starting point",
      depth: "Variable; count down to the target depth",
      technique: "Try a steady retrieve or a lift-and-fall presentation.",
      score: 50,
      reasons: []
    },
    {
      name: "Suspending Jerkbait",
      color: "Natural shad or bluegill",
      size: "3–4 inch starting point",
      depth: "Middle of the water column",
      technique: "Use short movements followed by pauses.",
      score: 50,
      reasons: []
    },
    {
      name: "Topwater Walking Bait",
      color: "Shad or natural baitfish",
      size: "3–4 inch starting point",
      depth: "Surface",
      technique: "Walk the bait across the surface with short rod movements.",
      score: 50,
      reasons: []
    },
    {
      name: "Swimbait",
      color: "Match the local baitfish",
      size: "3–4 inch starting point",
      depth: "Adjust to where baitfish and bass are located",
      technique: "Use a steady retrieve at the target depth.",
      score: 50,
      reasons: []
    },
    {
      name: "Ned Rig",
      color: "Green pumpkin or natural colors",
      size: "2.5–3 inch starting point",
      depth: "Near the bottom",
      technique: "Use a slow drag with occasional pauses.",
      score: 50,
      reasons: []
    }
  ];

  // ==========================================
  // 3. SCORING FUNCTION
  // ==========================================

  function points(name, amount, reason) {
    const lure = lures.find(item => item.name === name);

    if (!lure) return;

    lure.score += amount;

    if (reason && amount > 0) {
      lure.reasons.push(reason);
    }
  }

  // ==========================================
  // 4. WATER TEMPERATURE
  // ==========================================

  if (temp !== null) {
    if (temp < 50) {
      points("Suspending Jerkbait", 10, "A suspending presentation with pauses is worth testing in cold water.");
      points("Ned Rig", 8, "A slower bottom presentation is another option.");
      points("Lipless Crankbait", 4, "Can be worked with a slower lift-and-fall retrieve.");
      points("Topwater Walking Bait", -8);
    } else if (temp < 60) {
      points("Suspending Jerkbait", 8, "Pauses can be useful when bass are less willing to chase.");
      points("Lipless Crankbait", 6);
      points("Ned Rig", 5);
    } else if (temp < 75) {
      points("Spinnerbait", 3);
      points("Chatterbait", 3);
      points("Squarebill Crankbait", 3);
      points("Swimbait", 3);
    } else {
      points("Texas-Rigged Worm", 5, "A bottom presentation is worth testing in warm water.");
      points("Bass Jig", 5);
    }
  }

  // ==========================================
  // 5. WATER CLARITY
  // ==========================================

  if (clarity.includes("clear")) {
    points("Suspending Jerkbait", 7, "Natural-looking colors can be useful in clear water.");
    points("Swimbait", 7, "A natural baitfish presentation is a good clear-water option.");
    points("Ned Rig", 6, "A subtle presentation is worth trying.");
    points("Spinnerbait", -2);
  } else if (clarity.includes("muddy")) {
    points("Spinnerbait", 9, "Flash and vibration can help fish locate a moving bait.");
    points("Chatterbait", 7);
    points("Bass Jig", 5);
    points("Texas-Rigged Worm", 3);
    points("Swimbait", -3);
  } else if (clarity.includes("stain")) {
    points("Spinnerbait", 7, "A moving bait with flash can be useful in stained water.");
    points("Chatterbait", 6);
    points("Squarebill Crankbait", 4);
  }

  // ==========================================
  // 6. WEATHER AND LIGHT
  // ==========================================

  if (weather.includes("cloud") || weather.includes("overcast")) {
    points("Spinnerbait", 5, "Cloud cover can create opportunities for moving baits.");
    points("Chatterbait", 4);
    points("Topwater Walking Bait", 3);
  }

  if (weather.includes("rain")) {
    points("Spinnerbait", 4, "A moving bait can be worth trying during suitable rainy conditions.");
    points("Chatterbait", 3);
  }

  if (weather.includes("sun")) {
    points("Texas-Rigged Worm", 3, "A bottom presentation can be useful around shaded cover.");
    points("Bass Jig", 3);
  }

  if (time.includes("morning") || time.includes("evening")) {
    points("Topwater Walking Bait", 7, "Low-light periods can create surface-feeding opportunities.");
    points("Spinnerbait", 2);
  }

  if (time.includes("midday") || time.includes("afternoon")) {
    points("Texas-Rigged Worm", 3);
    points("Bass Jig", 3);
  }

  if (time.includes("night")) {
    points("Bass Jig", 6, "A slow bottom presentation is worth trying at night.");
    points("Texas-Rigged Worm", 6);
    points("Spinnerbait", 2);
  }

  // ==========================================
  // 7. WIND
  // ==========================================

  if (wind !== null) {
    if (wind >= 10) {
      points("Spinnerbait", 8, "Wind can make moving baits useful around wind-affected areas.");
      points("Chatterbait", 6);
      points("Lipless Crankbait", 4);
    } else if (wind >= 5) {
      points("Spinnerbait", 4);
      points("Chatterbait", 3);
    } else if (wind <= 2) {
      points("Ned Rig", 3, "Calm conditions can make a subtle presentation worth testing.");
      points("Texas-Rigged Worm", 3);
    }
  }

  // ==========================================
  // 8. SEASON
  // ==========================================

  if (season === "spring") {
    points("Spinnerbait", 3);
    points("Texas-Rigged Worm", 3);
    points("Bass Jig", 3);
  } else if (season === "summer") {
    points("Texas-Rigged Worm", 5, "Targeting cover and deeper edges can be productive in summer.");
    points("Bass Jig", 4);
    points("Topwater Walking Bait", 3);
  } else if (season === "fall") {
    points("Lipless Crankbait", 5, "A baitfish-style moving presentation is worth testing.");
    points("Spinnerbait", 4);
    points("Swimbait", 4);
  } else if (season === "winter") {
    points("Suspending Jerkbait", 5);
    points("Ned Rig", 4);
    points("Lipless Crankbait", 3);
  }

  // ==========================================
  // 9. STRUCTURE AND COVER
  // ==========================================

  if (structure.includes("grass")) {
    points("Chatterbait", 10, "Designed to be fished around and through suitable vegetation.");
    points("Spinnerbait", 7);
    points("Lipless Crankbait", 6);
    points("Texas-Rigged Worm", 5);
  } else if (structure.includes("wood")) {
    points("Texas-Rigged Worm", 10, "A weedless worm can be worked around submerged wood.");
    points("Bass Jig", 10, "A jig is useful around wood and brush.");
    points("Squarebill Crankbait", 4);
    points("Spinnerbait", 3);
  } else if (structure.includes("rock")) {
    points("Bass Jig", 9, "A jig can be worked along rocky structure.");
    points("Squarebill Crankbait", 7);
    points("Ned Rig", 6);
    points("Lipless Crankbait", 3);
  } else if (structure.includes("dock")) {
    points("Texas-Rigged Worm", 9, "A worm can be pitched around dock posts and shade.");
    points("Bass Jig", 9);
    points("Swimbait", 3);
  } else if (structure.includes("open")) {
    points("Swimbait", 8, "A swimbait can imitate baitfish in open water.");
    points("Suspending Jerkbait", 5);
    points("Lipless Crankbait", 4);
  } else if (structure.includes("mixed")) {
    points("Spinnerbait", 3);
    points("Texas-Rigged Worm", 3);
    points("Bass Jig", 3);
  }

  // ==========================================
  // 10. WATER DEPTH
  // ==========================================

  if (depth.includes("shallow")) {
    points("Squarebill Crankbait", 6, "A shallow-running crankbait can target shallow cover.");
    points("Spinnerbait", 5);
    points("Chatterbait", 4);
    points("Topwater Walking Bait", 3);
  } else if (depth.includes("medium")) {
    points("Swimbait", 4);
    points("Lipless Crankbait", 4);
    points("Suspending Jerkbait", 3);
  } else if (depth.includes("deep")) {
    points("Ned Rig", 6, "A bottom presentation can target deeper areas.");
    points("Bass Jig", 6);
    points("Texas-Rigged Worm", 5);
    points("Swimbait", 4);
  }

  // ==========================================
  // 11. FORAGE
  // ==========================================

  if (forage.includes("shad")) {
    points("Swimbait", 9, "Imitates the shad that bass are feeding on.");
    points("Lipless Crankbait", 7);
    points("Spinnerbait", 5);
    points("Suspending Jerkbait", 4);
  } else if (forage.includes("bluegill")) {
    points("Chatterbait", 7, "A bluegill-style color can imitate available prey.");
    points("Swimbait", 7);
    points("Bass Jig", 5);
    points("Spinnerbait", 4);
  } else if (forage.includes("crawfish")) {
    points("Bass Jig", 9, "A crawfish-colored jig can imitate crawfish.");
    points("Texas-Rigged Worm", 5);
    points("Squarebill Crankbait", 5);
    points("Lipless Crankbait", 3);
  } else if (forage.includes("other")) {
    points("Swimbait", 2);
  }

  // ==========================================
  // 12. ADJUST COLORS FOR CLARITY
  // ==========================================

  if (clarity.includes("muddy")) {
    lures.forEach(lure => {
      if (["Spinnerbait", "Chatterbait", "Bass Jig"].includes(lure.name)) {
        lure.color = "Black and blue, chartreuse, or contrasting colors";
      }
    });
  }

  // ==========================================
  // 13. RANK THE LURES
  // ==========================================

  lures.forEach(lure => {
    lure.score = Math.max(0, Math.min(100, lure.score));
  });

  lures.sort((a, b) => b.score - a.score);

  const topThree = lures.slice(0, 3);

  // ==========================================
  // 14. DISPLAY RESULTS
  // ==========================================

  const conditionSummary = [
    temp !== null ? temp + "°F water" : "Unknown temperature",
    season || "Unknown season",
    time || "Unknown time",
    clarity || "Unknown clarity",
    wind !== null ? wind + " mph wind" : "Unknown wind",
    structure || "Unknown structure",
    depth || "Unknown depth",
    forage || "Unknown forage"
  ].join(" • ");

  result.style.display = "block";

  result.innerHTML = `
    <div style="margin-top:25px; padding:20px; border-radius:12px; background:#172a2c; color:#f4f7f5;">

      <h2 style="margin-top:0;">Your Top 3 Bass Recommendations</h2>

      <p style="color:#b9c9c4; font-size:13px;">
        Based on the conditions you entered.
      </p>

      <p style="font-size:13px; color:#b9c9c4;">
        ${conditionSummary}
      </p>

      ${topThree.map((lure, index) => `
        <div style="padding:16px; margin-top:15px; background:#203739; border-radius:10px;">

          <div style="font-size:13px; color:#9fd7b5;">
            RANK #${index + 1}
          </div>

          <h3 style="margin:8px 0;">
            ${lure.name}
          </h3>

          <div style="font-size:25px; font-weight:bold;">
            ${lure.score}/100
          </div>

          <div style="height:8px; background:#344c4d; border-radius:10px; margin:10px 0;">
            <div style="height:8px; width:${lure.score}%; background:#67b68c; border-radius:10px;"></div>
          </div>

          <p><strong>Color:</strong> ${lure.color}</p>
          <p><strong>Size:</strong> ${lure.size}</p>
          <p><strong>Suggested depth:</strong> ${lure.depth}</p>
          <p><strong>Technique:</strong> ${lure.technique}</p>

          <strong>Why it ranked here:</strong>

          <ul>
            ${lure.reasons.length
              ? lure.reasons.slice(0, 4).map(reason => `<li>${reason}</li>`).join("")
              : "<li>It remains a general option, but the available conditions did not strongly favor it.</li>"
            }
          </ul>

        </div>
      `).join("")}

      <p style="font-size:12px; color:#b9c9c4; margin-top:18px;">
        Scores represent preliminary condition matches, not catch probabilities.
        Missing information is not treated as a known condition.
        These rankings are starting suggestions, not guaranteed results.
      </p>

    </div>
  `;

  result.scrollIntoView({ behavior: "smooth", block: "start" });
});
</script>
<script src="LureDatabase.js"></script>
  <script>
  document.body.insertAdjacentHTML(
    "beforeend",
    "<p style='padding:10px;background:#d1fae5;color:#065f46;'>Database loaded: " +
    (window.lureDatabase ? window.lureDatabase.length : 0) +
    " techniques</p>"
  );
</script>
</body>
</html>
